server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful
spring:
  application:
    name: ai-knowledge-base
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  jackson:
    time-zone: UTC
  lifecycle:
    timeout-per-shutdown-phase: 60s
  reactor:
    context-propagation: auto
  autoconfigure:
    exclude: org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 30
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
      keepalive-time: 300000
      validation-timeout: 5000
      leak-detection-threshold: 60000
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
      database: 0
      password: ${REDIS_PASSWORD}
      timeout: 5s
      connect-timeout: 5s
      ssl:
        enabled: false
      lettuce:
        pool:
          enabled: true
          max-active: 32
          max-idle: 16
          min-idle: 4
          max-wait: 1s
  mvc:
    async:
      request-timeout: 160s
  ai:
    retry:
      max-attempts: 3
    openai:
      base-url: ${OPENAI_BASE_URL:https://api.openai.com/v1}
      api-key: ${OPENAI_API_KEY}
      chat:
        timeout: 150s
        model: qwen3.8-max
        max-completion-tokens: 4096
    chat:
      memory:
        redis:
          key-prefix: "akb:chat:memory:"
          index-name: akb-chat-memory-idx
          initialize-schema: true
          max-messages-per-conversation: 6
          metadata-fields:
            - name: messageType
              type: tag
      client:
        observations:
          log-prompt: false
          log-completion: false
      observations:
        log-prompt: false
        log-completion: false
    tools:
      observations:
        include-content: false
mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
    # log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    banner: false
    db-config:
      id-type: input
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
app:
  auth:
    issuer: ai-knowledge-base
    jwt-secret: ${JWT_SECRET}
    access-token-ttl: 30m
    refresh-token-ttl: 30d
  ai:
    system-prompt: 你是一个有帮助、准确且简洁的 AI 助手。
    memory-window-size: 6
    model: qwen3.8-max
  chat:
    message-max-length: 256
    sse:
      max-active-connections: 1000
      max-queued-requests: 1000
      llm-concurrency: 100
      queue-timeout: 30s
      generation-timeout: 85s
      heartbeat-interval: 15s
      max-lifetime: 140s
      user-lock-ttl: 180s
      sink-buffer-size: 64
      terminal-retention: 10s
      janitor-interval: 5s

  request-admission:
    enabled: true
    fail-open: false
  snowflake:
    worker-id: 1
    datacenter-id: 1
  openapi:
    enabled: true
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
logging:
  level:
    root: INFO
    '[org.springframework.ai.chat.client.advisor.SimpleLoggerAdvisor]': DEBUG

